<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · SolarFlow</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%23f6c343'/%3E%3Cg stroke='%23f6c343' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M32 4v10M32 50v10M4 32h10M50 32h10M12 12l7 7M45 45l7 7M12 52l7-7M45 19l7-7'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        :root { --primary: #1976d2; --bg-dark: #0a0a0a; --bg-light: #1a1a1a; --text: #fff; --muted: #b0b0b0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, var(--bg-dark), var(--bg-light)); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
        main { text-align: center; max-width: 520px; }
        h1 { font-size: 4rem; color: var(--primary); }
        p { color: var(--muted); margin: 1rem 0 1.5rem; }
        a.btn { display: inline-block; padding: 0.75rem 1.25rem; border-radius: 10px; background: var(--primary); color: #fff; text-decoration: none; font-weight: 600; }
        code { background: rgba(255,255,255,0.08); padding: 0.1rem 0.4rem; border-radius: 4px; }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>That page does not exist in SolarFlow. The address may have changed when old test pages were removed.</p>
        <p id="path"></p>
        <a class="btn" href="./index.html">Back to the dashboard</a>
    </main>
    <script>
        const el = document.getElementById('path');
        const code = document.createElement('code');
        code.textContent = location.pathname;
        el.append('Requested: ', code);
    </script>
</body>
</html>
